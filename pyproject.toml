[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xid"
version = "0.0.1"
description = "Research infrastructure for identifying cross-asset price impact under order-flow commonality."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "xid contributors" }]
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.1",
  "pytest==8.4.1",
  "ruff==0.12.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xid"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
